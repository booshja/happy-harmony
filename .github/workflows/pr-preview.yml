name: PR Preview Deploy

on:
  workflow_run:
    workflows: ["CI", "Playwright Tests"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.meta.outputs.pr_number }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
      should_deploy: ${{ steps.meta.outputs.should_deploy }}
    steps:
      - name: Resolve PR + gate on green checks
        id: meta
        uses: actions/github-script@v7
        with:
          script: |
            const core = require("@actions/core");
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            if (!run || run.conclusion !== "success") {
              core.setOutput("should_deploy", "false");
              return;
            }

            const headSha = run.head_sha;
            let pr = run.pull_requests?.[0];

            if (!pr) {
              const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: headSha,
              });
              pr = prs.data[0];
            }

            if (!pr) {
              core.setOutput("should_deploy", "false");
              return;
            }

            const prNumber = pr.number;
            const prData = pr.pull_request
              ? pr
              : (
                  await github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: prNumber,
                  })
                ).data;

            const isSameRepo =
              prData.head.repo.full_name === `${owner}/${repo}`;

            core.setOutput("pr_number", String(prNumber));
            core.setOutput("head_sha", headSha);

            if (!isSameRepo) {
              core.setOutput("should_deploy", "false");
              return;
            }

            const workflows = ["ci.yml", "playwright.yml"];
            const results = await Promise.all(
              workflows.map(async (workflowId) => {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: workflowId,
                  head_sha: headSha,
                  event: "pull_request",
                });
                return runs.data.workflow_runs.some(
                  (r) => r.status === "completed" && r.conclusion === "success"
                );
              })
            );

            const shouldDeploy = results.every(Boolean);
            core.setOutput("should_deploy", shouldDeploy ? "true" : "false");

  deploy:
    needs: meta
    if: needs.meta.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pr-preview-${{ needs.meta.outputs.pr_number }}
      cancel-in-progress: true
    env:
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_SENTRY_ORG: ${{ vars.VITE_SENTRY_ORG }}
      VITE_SENTRY_PROJECT: ${{ vars.VITE_SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      PR_NUMBER: ${{ needs.meta.outputs.pr_number }}
      HEAD_SHA: ${{ needs.meta.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.head_sha }}

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e "
            const fs = require('fs');
            const base = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'));
            const config = {
              ...base,
              name: 'happy-harmony-pr-${PR_NUMBER}',
              d1_databases: [{ binding: 'DB', database_name: 'happy-harmony-staging', database_id: '4cf700d6-e8d9-4006-b508-60c4a676d6fb' }],
              routes: [],
            };
            fs.writeFileSync('dist/server/wrangler.preview.json', JSON.stringify(config));
          "
          pnpm exec wrangler deploy --config dist/server/wrangler.preview.json
          echo "preview_url=https://happy-harmony-pr-${PR_NUMBER}.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- pr-preview-url -->";
            const previewUrl = "${{ steps.deploy.outputs.preview_url }}";
            const body = [
              marker,
              `✅ Preview ready: ${previewUrl}`,
              `Commit: ${process.env.HEAD_SHA}`,
              "",
              "_Preview deploy runs only after CI + Playwright pass._",
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const existing = comments.data.find((comment) =>
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
